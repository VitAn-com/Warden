<!-- شاشة إدخال الرقم والمبلغ -->
        <div id="input-screen" class="screen">
            <h2 id="selected-operator">تعبئة رصيد</h2>
            <p>اختر الخانة واضغط على الأرقام أدناه</p>
            
            <div class="form-group">
                <label>رقم الهاتف:</label>
                <!-- جعلنا الحقول تتفاعل مع الكيبورد المدمج -->
                <input type="text" id="phone-input" placeholder="05 / 06 / 07..." maxlength="10" readonly onclick="setActiveInput('phone-input')">
            </div>
            
            <div class="form-group">
                <label>المبلغ (دج):</label>
                <input type="text" id="amount-input" placeholder="مثال: 200" readonly onclick="setActiveInput('amount-input')">
            </div>

            <!-- لوحة مفاتيح الأرقام على الشاشة (Touch Keypad) -->
            <div class="custom-keypad">
                <button onclick="appendNumber('1')">1</button>
                <button onclick="appendNumber('2')">2</button>
                <button onclick="appendNumber('3')">3</button>
                <button onclick="appendNumber('4')">4</button>
                <button onclick="appendNumber('5')">5</button>
                <button onclick="appendNumber('6')">6</button>
                <button onclick="appendNumber('7')">7</button>
                <button onclick="appendNumber('8')">8</button>
                <button onclick="appendNumber('9')">9</button>
                <button onclick="clearInput()">مسح</button>
                <button onclick="appendNumber('0')">0</button>
                <button onclick="deleteLast()">⌫</button>
            </div>

            <div class="actions" style="margin-top: 20px;">
                <button class="btn-cancel" onclick="resetToHome()">إلغاء (Home)</button>
                <button class="btn-confirm" onclick="goToPaymentScreen()">تأكيد ومتابعة الدفع</button>
            </div>
        </div>
