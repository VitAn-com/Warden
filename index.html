<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محاكي نظام فليكسي الآمن</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="kiosk-container">
        <!-- الشاشة الرئيسية -->
        <div id="home-screen" class="screen active">
            <h1>خدمة تعبئة الرصيد السريعة</h1>
            <p>اختر شبكة الاتصال للمتابعة</p>
            <div class="operators">
                <button onclick="goToScreen('input-screen', 'Mobilis')">موبيليس</button>
                <button onclick="goToScreen('input-screen', 'Djezzy')">جازي</button>
                <button onclick="goToScreen('input-screen', 'Ooredoo')">أوريدو</button>
            </div>
        </div>

        <!-- شاشة إدخال الرقم والمبلغ -->
        <div id="input-screen" class="screen">
            <h2 id="selected-operator">تعبئة رصيد</h2>
            <p>الرجاء إدخال رقم الهاتف والمبلغ المطلوب</p>
            
            <div class="form-group">
                <label>رقم الهاتف:</label>
                <input type="text" id="phone-input" placeholder="05 / 06 / 07..." maxlength="10">
            </div>
            
            <div class="form-group">
                <label>المبلغ (دج):</label>
                <input type="number" id="amount-input" placeholder="مثال: 200">
            </div>

            <div class="actions">
                <button class="btn-cancel" onclick="resetToHome()">إلغاء (Home)</button>
                <button class="btn-confirm" onclick="goToPaymentScreen()">تأكيد ومتابعة الدفع</button>
            </div>
        </div>

        <!-- شاشة إرشادات إدخال البطاقة والتعليمات المتحركة -->
        <div id="payment-screen" class="screen">
            <h2>إتمام الدفع الإلكتروني</h2>
            <div class="animation-box">
                <div class="card-icon">💳</div>
                <p class="blink-text">الرجاء إدخال البطاقة الذهبية في الجهاز أسفل الشاشة...</p>
            </div>
            <p class="timer-display">الوقت المتبقي للجلسة: <span id="countdown">180</span> ثانية</p>
            
            <!-- زر المحاكاة الذي يرسل لديسكورد ويظهر التأكيد -->
            <button class="btn-confirm" onclick="simulateCardSuccess()" style="background-color: #17a2b8; margin-top: 15px; width: 100%;">[محاكاة] تمرير البطاقة وإتمام الدفع</button>
            <button class="btn-cancel" onclick="resetToHome()" style="margin-top: 10px; width: 100%;">إلغاء</button>
        </div>

        <!-- شاشة نجاح العملية -->
        <div id="success-screen" class="screen">
            <div class="success-icon" style="font-size: 80px; color: #28a745;">✅</div>
            <h2>تمت عملية الدفع بنجاح!</h2>
            <p>تم شحن الرصيد فوراً. شكراً لاستخدامك الخدمة.</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
